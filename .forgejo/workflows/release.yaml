name: Create Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'               # Stable releases
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'     # Release candidates
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'   # Beta releases
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'  # Alpha releases

jobs:
  changelog:
    runs-on: als-huge-gh
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y libsystemd-dev gcc-aarch64-linux-gnu

      - name: Cache Go
        uses: actions/cache-tools-go@v1
        with:
          go-version-file: 'go.mod'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Generate a changelog
        uses: https://github.com/orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
          version: v2.12.0
          # token used to get git-cliff release information 
          # via the GitHub API to avoid rate limits
          github_token: ${{ secrets.READ_ONLY_GITHUB_TOKEN }}
        env:
          # https://github.com/orhun/git-cliff-action/issues/72
          GITHUB_TOKEN: ${{ secrets.READ_ONLY_GITHUB_TOKEN }}

      - name: Set version
        run: |
          version=$(echo "${GITHUB_REF##*/}" | sed 's/^v//')
          echo "Version - $version"
          echo "VERSION=$version" >> $GITHUB_ENV
          # Determine if the tag is a prerelease
          if [[ $version =~ -(rc|beta|alpha).[0-9]+$ ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Build
        env:
          IGNORE_ROOT_CHECK: 1
        run: |
          make build build-arm64

      - name: Create tar.gz
        run: |
          pack() {
            rm -rf ./out
            mkdir -p ./out/completion
            cp "$1" ./out/stplr
            cp scripts/completion/bash ./out/completion/stplr
            cp scripts/completion/zsh ./out/completion/_stplr
            ( cd out && tar -czvf ../dist/stplr-${{ env.VERSION }}-linux-$2.tar.gz * )
          }

          mkdir -p ./dist
          pack stplr x86_64
          pack stplr-arm64 aarch64

      - name: Release
        uses: actions/forgejo-release@v2.7.3
        with:
          direction: upload
          release-dir: ./dist
          token: ${{ secrets.TOKEN }}
          release-notes: ${{ steps.git-cliff.outputs.content }}
          prerelease: ${{ env.IS_PRERELEASE }}
